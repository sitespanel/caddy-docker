# Cloud Build: Caddy image for SitesPanel.
# Publish build: a push to main and the weekly rebuild. Builds one image after another on the default
# machine (the free build-minutes apply only to it), scans each with Trivy, and pushes to ghcr.io only when
# every scan passed; then attaches each image's SPDX SBOM to its digest (SitesPanel ADR-0065).

substitutions:
  _REGISTRY: ghcr.io/sitespanel
  _GHCR_USER: sitespanel-image-builder  # the GitHub account that owns the push token
  _GHCR_TOKEN_SECRET: sitespanel-ghcr-image-push-token-cloudbuild  # Secret Manager secret holding the token

steps:
  # The version tag comes from the Dockerfile.
  - id: version
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v=$$(grep -oP '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
        [ -n "$$v" ] || { echo "could not read the version from the Dockerfile"; exit 1; }
        echo "$$v" > /workspace/version
        echo "version $$v"
    waitFor: ['-']
  - id: build-caddy
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/caddy-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - --label=org.opencontainers.image.description=SitesPanel Caddy image
      - --tag=${_REGISTRY}/caddy:$SHORT_SHA
      - --tag=${_REGISTRY}/caddy:latest
      - .
    waitFor: ['-']
  - id: scan-caddy
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/caddy.tar ${_REGISTRY}/caddy:$SHORT_SHA']
    waitFor: ['build-caddy']
  - id: trivy-caddy
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/caddy.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/caddy.tar --format spdx-json --output /workspace/sbom/caddy.spdx.json
        rm -f /workspace/caddy.tar
    waitFor: ['scan-caddy']
  # Push only after every scan passed. The token never appears in the log.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['GHCR_TOKEN']
    args:
      - -ceu
      - |
        echo "$$GHCR_TOKEN" | docker login ghcr.io --username ${_GHCR_USER} --password-stdin
        v=$$(cat /workspace/version)
        docker tag ${_REGISTRY}/caddy:$SHORT_SHA ${_REGISTRY}/caddy:$$v
        docker push ${_REGISTRY}/caddy:$SHORT_SHA
        docker push ${_REGISTRY}/caddy:latest
        docker push ${_REGISTRY}/caddy:$$v
        docker inspect --format '{{index .RepoDigests 0}}' ${_REGISTRY}/caddy:$SHORT_SHA > /workspace/caddy.digest
    waitFor: ['trivy-caddy', 'version']
  # Each SBOM is attached to its image's digest in ghcr.io, so it travels with the image.
  - id: sbom
    name: ghcr.io/oras-project/oras:v1.3.5@sha256:2f43a2bd4797df77ab38cf24ec92ae34a98a82cdf4ec507537e44081c603630e
    entrypoint: sh
    args:
      - -ceu
      - |
        oras attach --registry-config /builder/home/.docker/config.json --artifact-type application/spdx+json "$$(cat /workspace/caddy.digest)" /workspace/sbom/caddy.spdx.json:application/spdx+json
    waitFor: ['push']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_GHCR_TOKEN_SECRET}/versions/latest
      env: GHCR_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
