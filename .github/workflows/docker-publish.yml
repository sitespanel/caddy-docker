name: Docker Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'README.md'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/caddy-docker'
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Extract Caddy version from Dockerfile
        id: get_version
        run: |
          # Extract version from actual FROM directives only (not comments).
          # Matches lines like 'FROM caddy:2.11.7' or 'FROM caddy:2.11.7-builder'
          VERSION=$(grep -oP '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Dockerfile."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            morsalin1342/caddy:${{ steps.get_version.outputs.version }}
            morsalin1342/caddy:latest
            easydigital/caddy:${{ steps.get_version.outputs.version }}
            easydigital/caddy:latest
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Interim scanning (planning: TASK-0008, Q-150), until the Cloud Build pipeline exists: after the push,
      # a fixable critical vulnerability fails the run, and an SPDX SBOM is kept as a workflow artifact.
      - name: Scan the pushed image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/caddy:${{ steps.get_version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/caddy:${{ steps.get_version.outputs.version }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-caddy-${{ steps.get_version.outputs.version }}
          path: sbom.spdx.json

  update_readme:
    # This job runs only after build_and_publish has succeeded.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/caddy-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/caddy
          readme-filepath: ./README.dockerhub.md
          short-description: 'Production-ready Caddy with Coraza WAF, rate limiting, Brotli, Souin cache and 6 DNS providers'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/caddy
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'Production-ready Caddy with Coraza WAF, rate limiting, Brotli, Souin cache and 6 DNS providers'
